name: Apply strict GPX input modes

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update:
    if: github.event.issue.title == 'Apply strict input modes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply update
        run: python .github/apply_strict_inputs.py

      - name: Validate
        run: python -m unittest discover -s tests -v

      - name: Commit update
        shell: bash
        run: |
          rm .github/workflows/apply-strict-input-modes.yml
          rm .github/apply_strict_inputs.py
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add -A
          git commit -m "Support directory or file-list inputs"
          git push

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Input-mode update applied and validated."
