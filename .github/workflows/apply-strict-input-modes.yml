name: Apply strict GPX input modes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply strict input update
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/apply_strict_inputs.py')
          text = path.read_text(encoding='utf-8')
          original = r'message=f"Error: {error}\n")'.replace(r'\"', '"')
          replacement = r'message=f"Error: {error}\\n")'.replace(r'\"', '"')
          if original not in text:
              raise RuntimeError('Could not find splitter error-message generator')
          path.write_text(text.replace(original, replacement, 1), encoding='utf-8')
          PY
          python .github/apply_strict_inputs.py

      - name: Validate
        run: |
          python -m py_compile gpx_splitter.py identify_trails.py merge_gpx.py
          python -m unittest discover -s tests -v

      - name: Commit generated changes
        run: |
          rm .github/workflows/apply-strict-input-modes.yml
          rm .github/apply_strict_inputs.py
          rm -f .github/strict-input-mode-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce strict GPX input modes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
