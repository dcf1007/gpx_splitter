name: Apply waypoint enrichment update

on:
  push:
    paths:
      - .github/workflows/apply-waypoint-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply source and documentation changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise RuntimeError(f"Could not find patch anchor: {label}")
              return text.replace(old, new, 1)

          script_path = Path("identify_trails.py")
          script = script_path.read_text(encoding="utf-8")

          script = replace_once(
              script,
              '''HIGHLIGHT_CATEGORIES = {
              "natural=cave_entrance",
              "natural=spring",
              "natural=water",
              "natural=peak",
              "natural=saddle",
              "natural=rock",
              "natural=cliff",
              "waterway=waterfall",
              "tourism=viewpoint",
              "tourism=attraction",
              "tourism=information",
              "tourism=picnic_site",
              "tourism=wilderness_hut",
              "tourism=alpine_hut",
              "leisure=nature_reserve",
          }
          ''',
              '''HIGHLIGHT_CATEGORIES = {
              "natural=cave_entrance",
              "natural=spring",
              "natural=water",
              "natural=peak",
              "natural=saddle",
              "natural=rock",
              "natural=cliff",
              "waterway=waterfall",
              "tourism=viewpoint",
              "tourism=attraction",
              "tourism=information",
              "tourism=picnic_site",
              "tourism=wilderness_hut",
              "tourism=alpine_hut",
              "leisure=nature_reserve",
          }
          WAYPOINT_CATEGORIES = HIGHLIGHT_CATEGORIES | {
              "amenity=parking",
          }
          ''',
              "waypoint categories",
          )

          relevant_waypoints = '''
          
          def relevant_waypoints(result: Identification) -> list[Landmark]:
              """Return unique visited landmarks that belong in the copied GPX."""
          
              unique: dict[tuple[str, str], Landmark] = {}
              for landmark in result.landmarks:
                  if not landmark.visited or landmark.category not in WAYPOINT_CATEGORIES:
                      continue
                  key = (landmark.name.strip().casefold(), landmark.category)
                  previous = unique.get(key)
                  if previous is None or landmark.distance_m < previous.distance_m:
                      unique[key] = landmark
              return sorted(
                  unique.values(),
                  key=lambda item: (item.distance_m, item.name.casefold()),
              )
          '''
          script = replace_once(
              script,
              "\n\ndef first_gpx_date(path: Path) -> str | None:\n",
              relevant_waypoints + "\n\ndef first_gpx_date(path: Path) -> str | None:\n",
              "relevant waypoint selector",
          )

          waypoint_helpers = '''
          
          def qualified_gpx_tag(root: etree._Element, name: str) -> str:
              namespace = etree.QName(root).namespace
              return f"{{{namespace}}}{name}" if namespace else name
          
          
          def existing_waypoint_names(root: etree._Element) -> set[str]:
              names: set[str] = set()
              for child in root:
                  if not isinstance(child.tag, str) or local_name(child.tag) != "wpt":
                      continue
                  name = direct_child_text(child, "name")
                  if name and name.strip():
                      names.add(name.strip().casefold())
              return names
          
          
          def add_landmark_waypoints(
              root: etree._Element,
              landmarks: Sequence[Landmark],
          ) -> None:
              """Append relevant landmarks as root-level GPX waypoints."""
          
              known_names = existing_waypoint_names(root)
              insertion_index = len(root)
              for index, child in enumerate(root):
                  if (
                      isinstance(child.tag, str)
                      and local_name(child.tag) in {"rte", "trk", "extensions"}
                  ):
                      insertion_index = index
                      break
          
              for landmark in landmarks:
                  normalized_name = landmark.name.strip().casefold()
                  if normalized_name in known_names:
                      continue
          
                  waypoint = etree.Element(
                      qualified_gpx_tag(root, "wpt"),
                      lat=f"{landmark.latitude:.8f}",
                      lon=f"{landmark.longitude:.8f}",
                  )
                  name = etree.SubElement(waypoint, qualified_gpx_tag(root, "name"))
                  name.text = landmark.name
                  description = etree.SubElement(
                      waypoint,
                      qualified_gpx_tag(root, "desc"),
                  )
                  description.text = (
                      f"Visited {landmark.category} near the recorded track; "
                      f"nearest track point {landmark.distance_m:.0f} m away."
                  )
                  waypoint_type = etree.SubElement(
                      waypoint,
                      qualified_gpx_tag(root, "type"),
                  )
                  waypoint_type.text = landmark.category
                  root.insert(insertion_index, waypoint)
                  insertion_index += 1
                  known_names.add(normalized_name)
          '''
          script = replace_once(
              script,
              "\n\ndef write_highlight_copy(\n",
              waypoint_helpers + "\n\ndef write_highlight_copy(\n",
              "waypoint writer helpers",
          )
          script = replace_once(
              script,
              "    set_track_description(tracks[0], highlight_description(highlights))\n    tree.write(\n",
              "    set_track_description(tracks[0], highlight_description(highlights))\n    add_landmark_waypoints(tree.getroot(), relevant_waypoints(result))\n    tree.write(\n",
              "waypoint insertion call",
          )
          script_path.write_text(script, encoding="utf-8")

          documentation_path = Path("TRAIL_IDENTIFIER.md")
          documentation = documentation_path.read_text(encoding="utf-8")
          documentation = replace_once(
              documentation,
              "Parking areas and settlements are not treated as highlights for this purpose.",
              "Parking areas are not treated as highlights for choosing the main highlight or output filename.",
              "highlight wording",
          )
          description_example = '''```text
          Main highlight: Cueva Serena. Other visited highlights: Mirador del Bosque; Cascada Alta.
          ```
          '''
          waypoint_documentation = description_example + '''
          The copy also contains root-level GPX `<wpt>` elements for every visited relevant landmark. This includes all visited highlights and visited named parking areas. Each generated waypoint contains:
          
          - its OpenStreetMap latitude and longitude;
          - a `<name>` with the landmark name;
          - a `<desc>` with the feature category and distance from the recorded track;
          - a `<type>` containing the OpenStreetMap category, such as `tourism=viewpoint` or `amenity=parking`.
          
          Waypoints already present in the source GPX are preserved. A generated waypoint is skipped when the source already contains a waypoint with the same name.
          '''
          documentation = replace_once(
              documentation,
              description_example,
              waypoint_documentation,
              "waypoint documentation",
          )
          documentation_path.write_text(documentation, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              "Tracks with multiple visited highlights also receive a renamed GPX copy with a generated description.",
              "Tracks with multiple visited highlights also receive a renamed GPX copy with a generated description and visited highlight and parking waypoints.",
              "README summary",
          )
          readme_path.write_text(readme, encoding="utf-8")

          test_path = Path("tests/test_identify_trails.py")
          test = test_path.read_text(encoding="utf-8")
          test = replace_once(
              test,
              '  <metadata><time>2025-05-06T09:00:00Z</time></metadata>\n  <trk>',
              '  <metadata><time>2025-05-06T09:00:00Z</time></metadata>\n  <wpt lat="39.9" lon="-3.1"><name>Existing Waypoint</name></wpt>\n  <trk>',
              "existing waypoint fixture",
          )
          assertion_anchor = '''            self.assertEqual(
              "Original description.\\n\\n"
              "Main highlight: Main Cave. "
              "Other visited highlights: River View.",
              description,
          )
          '''
          waypoint_assertions = assertion_anchor + '''
          
              waypoint_names = tree.xpath(
                  '/*[local-name()="gpx"]/*[local-name()="wpt"]/'
                  '*[local-name()="name"]/text()'
              )
              self.assertEqual(
                  [
                      "Existing Waypoint",
                      "Parking Area",
                      "Main Cave",
                      "River View",
                  ],
                  waypoint_names,
              )
          
              waypoint_types = tree.xpath(
                  '/*[local-name()="gpx"]/*[local-name()="wpt"]/'
                  '*[local-name()="type"]/text()'
              )
              self.assertEqual(
                  [
                      "amenity=parking",
                      "natural=cave_entrance",
                      "tourism=viewpoint",
                  ],
                  waypoint_types,
              )
          '''
          test = replace_once(
              test,
              assertion_anchor,
              waypoint_assertions,
              "waypoint assertions",
          )
          test_path.write_text(test, encoding="utf-8")

      - name: Run tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v tests/test_identify_trails.py

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add identify_trails.py TRAIL_IDENTIFIER.md README.md tests/test_identify_trails.py
          git commit -m "Add relevant waypoints to enriched GPX copies"
          git push
