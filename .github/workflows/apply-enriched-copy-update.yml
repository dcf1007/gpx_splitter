name: Apply unconditional enriched GPX copies

on:
  push:
    paths:
      - .github/workflows/apply-enriched-copy-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch source, tests, and documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise RuntimeError(f"Could not find patch anchor: {label}")
              return text.replace(old, new, 1)

          script_path = Path("identify_trails.py")
          script = script_path.read_text(encoding="utf-8")

          script = replace_once(
              script,
              '''def safe_highlight_name(name: str) -> str:
              invalid = '<>:"/\\\\|?*'
              value = "".join("-" if character in invalid else character for character in name)
              value = "-".join(value.split())
              while "--" in value:
                  value = value.replace("--", "-")
              return value.strip(" .-_") or "highlight"
          
          
          def highlight_description(highlights: Sequence[Landmark]) -> str:
              description = f"Main highlight: {highlights[0].name}."
              other_names = [highlight.name for highlight in highlights[1:8]]
              if other_names:
                  description += " Other visited highlights: " + "; ".join(other_names) + "."
              if len(highlights) > 8:
                  description += f" Plus {len(highlights) - 8} additional highlight(s)."
              return description
          ''',
              '''def safe_filename_component(name: str) -> str:
              """Convert a route, highlight, or track name into a safe filename part."""
          
              invalid = '<>:"/\\\\|?*'
              value = "".join("-" if character in invalid else character for character in name)
              value = "-".join(value.split())
              while "--" in value:
                  value = value.replace("--", "-")
              return value.strip(" .-_") or "track"
          
          
          def highlight_description(highlights: Sequence[Landmark]) -> str | None:
              """Build a track description when one or more highlights were visited."""
          
              if not highlights:
                  return None
              description = f"Main highlight: {highlights[0].name}."
              other_names = [highlight.name for highlight in highlights[1:8]]
              if other_names:
                  description += " Other visited highlights: " + "; ".join(other_names) + "."
              if len(highlights) > 8:
                  description += f" Plus {len(highlights) - 8} additional highlight(s)."
              return description
          
          
          def enriched_copy_name(result: Identification, source_path: Path) -> str:
              """Choose a stable output name even when no highlight was visited."""
          
              highlights = ranked_highlights(result)
              if highlights:
                  preferred_name = highlights[0].name
              elif result.best_match is not None:
                  preferred_name = result.best_match.name
              else:
                  preferred_name = result.analysis.track_name or source_path.stem
          
              name = safe_filename_component(preferred_name)
              date = first_gpx_date(source_path)
              return f"{date}_{name}.gpx" if date else f"{name}.gpx"
          ''',
              "filename and description helpers",
          )

          script = replace_once(
              script,
              '''def write_highlight_copy(
              result: Identification,
              source_path: Path,
              output_path: Path,
          ) -> None:
              highlights = ranked_highlights(result)
              if len(highlights) < 2:
                  raise ValueError("At least two visited highlights are required")
          ''',
              '''def write_enriched_copy(
              result: Identification,
              source_path: Path,
              output_path: Path,
          ) -> None:
              """Copy a GPX file, add highlight text when available, and add waypoints."""
          
              highlights = ranked_highlights(result)
          ''',
              "single-copy function",
          )

          script = replace_once(
              script,
              '''    set_track_description(tracks[0], highlight_description(highlights))
              add_landmark_waypoints(tree.getroot(), relevant_waypoints(result))
          ''',
              '''    description = highlight_description(highlights)
              if description is not None:
                  set_track_description(tracks[0], description)
              add_landmark_waypoints(tree.getroot(), relevant_waypoints(result))
          ''',
              "optional highlight description",
          )

          script = replace_once(
              script,
              '''def write_highlight_copies(
              results: Sequence[Identification],
              source_paths: Sequence[Path],
              output_directory: Path,
          ) -> list[Path]:
              output_directory.mkdir(parents=True, exist_ok=True)
              written = []
              used_names: set[str] = set()
              for result, source_path in zip(results, source_paths):
                  highlights = ranked_highlights(result)
                  if len(highlights) < 2:
                      continue
                  date = first_gpx_date(source_path)
                  name = safe_highlight_name(highlights[0].name)
                  base_name = f"{date}_{name}.gpx" if date else f"{name}.gpx"
                  output_name = base_name
                  suffix = 2
                  while output_name.casefold() in used_names:
                      output_name = f"{Path(base_name).stem}_{suffix}.gpx"
                      suffix += 1
                  used_names.add(output_name.casefold())
                  output_path = output_directory / output_name
                  write_highlight_copy(result, source_path, output_path)
                  written.append(output_path)
              return written
          ''',
              '''def write_enriched_copies(
              results: Sequence[Identification],
              source_paths: Sequence[Path],
              output_directory: Path,
          ) -> list[Path]:
              """Write one enriched GPX copy for every successful identification."""
          
              output_directory.mkdir(parents=True, exist_ok=True)
              written: list[Path] = []
              used_names: set[str] = set()
              for result, source_path in zip(results, source_paths):
                  base_name = enriched_copy_name(result, source_path)
                  output_name = base_name
                  suffix = 2
                  while output_name.casefold() in used_names:
                      output_name = f"{Path(base_name).stem}_{suffix}.gpx"
                      suffix += 1
                  used_names.add(output_name.casefold())
                  output_path = output_directory / output_name
                  write_enriched_copy(result, source_path, output_path)
                  written.append(output_path)
              return written
          ''',
              "batch-copy function",
          )

          script = script.replace(
              "highlight_paths = write_highlight_copies(",
              "enriched_paths = write_enriched_copies(",
              1,
          )
          script = script.replace(
              'for path in highlight_paths:\n        print(f"  highlight_gpx: {path.resolve()}")',
              'for path in enriched_paths:\n        print(f"  enriched_gpx: {path.resolve()}")',
              1,
          )
          if any(name in script for name in (
              "write_highlight_copy",
              "write_highlight_copies",
              "safe_highlight_name",
          )):
              raise RuntimeError("Obsolete highlight-copy identifiers remain")
          script_path.write_text(script, encoding="utf-8")

          test_path = Path("tests/test_identify_trails.py")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace(
              "identify_trails.write_highlight_copies(",
              "identify_trails.write_enriched_copies(",
          )
          extra_tests = r'''
          
              def test_one_highlight_still_creates_an_enriched_copy(self) -> None:
                  gpx = """<?xml version="1.0" encoding="UTF-8"?>
          <gpx version="1.1" creator="test" xmlns="http://www.topografix.com/GPX/1/1">
            <metadata><time>2025-07-08T09:00:00Z</time></metadata>
            <trk>
              <name>Walk</name>
              <trkseg><trkpt lat="40.0" lon="-3.0"/></trkseg>
            </trk>
          </gpx>
          """
                  with tempfile.TemporaryDirectory() as temporary_directory:
                      directory = Path(temporary_directory)
                      source_path = directory / "source.gpx"
                      source_path.write_text(gpx, encoding="utf-8")
                      analysis = identify_trails.analyze_track(source_path)
                      identification = identify_trails.Identification(
                          analysis=analysis,
                          best_match=None,
                          candidates=[],
                          landmarks=[
                              identify_trails.Landmark(
                                  "cave", "Main Cave", "natural=cave_entrance",
                                  40.0, -3.0, 5.0, True, 180.0,
                              ),
                              identify_trails.Landmark(
                                  "parking", "Parking Area", "amenity=parking",
                                  40.0, -3.0, 10.0, True, 180.0,
                              ),
                          ],
                          warnings=[],
                          overpass_endpoint="test",
                          osm_timestamp=None,
                      )
          
                      output_paths = identify_trails.write_enriched_copies(
                          [identification], [source_path], directory / "results"
                      )
          
                      self.assertEqual(
                          [directory / "results" / "2025-07-08_Main-Cave.gpx"],
                          output_paths,
                      )
                      tree = etree.parse(str(output_paths[0]))
                      description = tree.xpath(
                          'string(/*[local-name()="gpx"]/*[local-name()="trk"]/*[local-name()="desc"])'
                      )
                      self.assertEqual("Main highlight: Main Cave.", description)
                      waypoint_names = tree.xpath(
                          '/*[local-name()="gpx"]/*[local-name()="wpt"]/'
                          '*[local-name()="name"]/text()'
                      )
                      self.assertEqual(["Main Cave", "Parking Area"], waypoint_names)
          
              def test_no_highlights_still_creates_a_copy_with_feature_waypoints(self) -> None:
                  gpx = """<?xml version="1.0" encoding="UTF-8"?>
          <gpx version="1.1" creator="test" xmlns="http://www.topografix.com/GPX/1/1">
            <metadata><time>2025-09-10T09:00:00Z</time></metadata>
            <trk>
              <name>Woodland Walk</name>
              <desc>Original description.</desc>
              <trkseg><trkpt lat="40.0" lon="-3.0"/></trkseg>
            </trk>
          </gpx>
          """
                  with tempfile.TemporaryDirectory() as temporary_directory:
                      directory = Path(temporary_directory)
                      source_path = directory / "source.gpx"
                      source_path.write_text(gpx, encoding="utf-8")
                      analysis = identify_trails.analyze_track(source_path)
                      identification = identify_trails.Identification(
                          analysis=analysis,
                          best_match=None,
                          candidates=[],
                          landmarks=[
                              identify_trails.Landmark(
                                  "parking", "Trailhead Parking", "amenity=parking",
                                  40.0, -3.0, 4.0, True, 180.0,
                              )
                          ],
                          warnings=[],
                          overpass_endpoint="test",
                          osm_timestamp=None,
                      )
          
                      output_paths = identify_trails.write_enriched_copies(
                          [identification], [source_path], directory / "results"
                      )
          
                      self.assertEqual(
                          [directory / "results" / "2025-09-10_Woodland-Walk.gpx"],
                          output_paths,
                      )
                      tree = etree.parse(str(output_paths[0]))
                      description = tree.xpath(
                          'string(/*[local-name()="gpx"]/*[local-name()="trk"]/*[local-name()="desc"])'
                      )
                      self.assertEqual("Original description.", description)
                      waypoint_names = tree.xpath(
                          '/*[local-name()="gpx"]/*[local-name()="wpt"]/'
                          '*[local-name()="name"]/text()'
                      )
                      self.assertEqual(["Trailhead Parking"], waypoint_names)
          '''
          marker = '\n\nif __name__ == "__main__":\n'
          if marker not in test:
              raise RuntimeError("Could not find test insertion marker")
          test = test.replace(marker, extra_tests + marker, 1)
          test_path.write_text(test, encoding="utf-8")

          doc_path = Path("TRAIL_IDENTIFIER.md")
          doc = doc_path.read_text(encoding="utf-8")
          replacements = (
              (
                  "9. When at least two visited highlights are detected, writes an enriched copy of the original GPX into the output directory.",
                  "9. Writes an enriched copy of every successfully analyzed GPX into the output directory, adding visited feature waypoints and highlight text when available.",
              ),
              (
                  "- an enriched GPX copy for any track with at least two visited highlights.",
                  "- one enriched GPX copy for every successfully analyzed track.",
              ),
              (
                  "When at least two unique highlights were visited, the script writes a copy of the original GPX into the results directory. The original GPX is not modified.",
                  "The script always writes a copy of every successfully analyzed GPX into the results directory, regardless of whether zero, one, or several highlights were visited. The original GPX is not modified.",
              ),
              (
                  "The copy's track-level `<desc>` field is created or extended with a short description such as:",
                  "When at least one highlight was visited, the copy's track-level `<desc>` field is created or extended with a short description such as:",
              ),
              (
                  "The highest-ranked visited highlight is used as the main highlight. The output filename is:",
                  "The output filename uses the highest-ranked visited highlight when one exists. Otherwise it uses the best matched trail name, and if no match exists it uses the GPX track name. The output filename is:",
              ),
              ("YYYY-MM-DD_Main-highlight.gpx", "YYYY-MM-DD_Preferred-name.gpx"),
              (
                  "The date is taken from the first valid metadata or track-point timestamp in GPX document order. When no valid timestamp exists, the date prefix is omitted. Spaces in the main highlight are replaced with dashes, and characters that are unsafe in filenames are also replaced.",
                  "The date is taken from the first valid metadata or track-point timestamp in GPX document order. When no valid timestamp exists, the date prefix is omitted. Spaces in the selected highlight, trail, or track name are replaced with dashes, and characters that are unsafe in filenames are also replaced.",
              ),
              (
                  "2025-05-06_Main-Cave.gpx\nCueva-Serena.gpx",
                  "2025-05-06_Main-Cave.gpx\n2025-05-06_River-Trail.gpx\nWoodland-Walk.gpx",
              ),
          )
          for old, new in replacements:
              doc = replace_once(doc, old, new, old[:50])
          doc_path.write_text(doc, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              "Tracks with multiple visited highlights also receive a renamed GPX copy with a generated description and visited highlight and parking waypoints.",
              "Every successfully analyzed track receives a renamed enriched GPX copy. Visited highlights and parking areas are added as waypoints, and highlight descriptions are added when highlights are present.",
              "README enriched-copy summary",
          )
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Run regression tests
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile identify_trails.py
          python -m unittest -v tests/test_identify_trails.py

      - name: Commit the update and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-enriched-copy-update.yml
          git add identify_trails.py tests/test_identify_trails.py TRAIL_IDENTIFIER.md README.md
          git commit -m "Always write enriched GPX copies"
          git push
