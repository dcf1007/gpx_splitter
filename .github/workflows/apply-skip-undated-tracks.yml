name: Apply skip-undated-track update

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/skip-undated-tracks'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply update
        run: python .github/apply_skip_undated_tracks.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Commit validated update
        shell: bash
        run: |
          rm .github/apply_skip_undated_tracks.py
          rm .github/workflows/apply-skip-undated-tracks.yml
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add merge_gpx.py tests/test_merge_gpx.py MERGE_GPX.md
          git add -u .github
          git commit -m "Skip tracks without timestamps"
          git push origin HEAD:${{ github.head_ref }}
